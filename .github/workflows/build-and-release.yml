name: Build Duddy APK & Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Tag (e.g., v1.0.0 - leave blank to auto-generate from run number)'
        required: false
        default: ''
        type: string
      custom_notes:
        description: 'Optional custom changelog / release description'
        required: false
        default: ''
        type: string
      is_draft:
        description: 'Create as a draft release'
        required: false
        default: false
        type: boolean
      is_prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Determine Version Tag
        id: versioning
        run: |
          INPUT_TAG="${{ github.event.inputs.version_name }}"
          if [ -z "$INPUT_TAG" ]; then
            TAG_NAME="v1.0.${{ github.run_number }}"
          else
            if [[ "$INPUT_TAG" != v* ]]; then
              TAG_NAME="v$INPUT_TAG"
            else
              TAG_NAME="$INPUT_TAG"
            fi
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Release tag: $TAG_NAME"

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating new debug keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and Package App APK
        run: |
          APK_SOURCE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "ERROR: Could not locate built APK."
            exit 1
          fi
          echo "Found APK at: $APK_SOURCE"
          
          # Rename with the app name and version tag
          OUTPUT_APK_NAME="Duddy-${{ env.TAG_NAME }}.apk"
          cp "$APK_SOURCE" "$OUTPUT_APK_NAME"
          echo "Packaged APK as: $OUTPUT_APK_NAME"
          echo "OUTPUT_APK_NAME=$OUTPUT_APK_NAME" >> $GITHUB_ENV

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Duddy-APK-${{ env.TAG_NAME }}
          path: ${{ env.OUTPUT_APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Release Notes & Changelog
        id: notes
        run: |
          CUSTOM_NOTES="${{ github.event.inputs.custom_notes }}"
          if [ -n "$CUSTOM_NOTES" ]; then
            BODY="### 🚀 What's New in Duddy ${{ env.TAG_NAME }}\n\n$CUSTOM_NOTES\n\n---\n*Built with Material 3 Expressive and Kotlin.*"
          else
            BODY="### 🚀 Duddy ${{ env.TAG_NAME }}\n\nFast, simple file download manager built with Material 3 Expressive design principles.\n\n- Real-time download progress tracking with live speed and ETA\n- File name badge on top of progress bar\n- Link-only input with enhanced short-link resolution and error handling\n- Direct stream without pause/resume overhead\n\n---\n*See below for full commit changelog and download the APK.*"
          fi
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo -e "$BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Duddy ${{ env.TAG_NAME }}
          body: ${{ env.RELEASE_BODY }}
          draft: ${{ github.event.inputs.is_draft }}
          prerelease: ${{ github.event.inputs.is_prerelease }}
          generate_release_notes: true
          files: ${{ env.OUTPUT_APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
