name: Build Duddy APK & Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Tag (e.g., v1.0.0 - leave blank to auto-generate from run number)'
        required: false
        default: ''
        type: string
      custom_notes:
        description: 'Optional custom changelog / release description'
        required: false
        default: ''
        type: string
      is_draft:
        description: 'Create as a draft release'
        required: false
        default: false
        type: boolean
      is_prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses & Prepare SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Determine Version Tag
        id: versioning
        run: |
          INPUT_TAG="${{ github.event.inputs.version_name }}"
          if [ -z "$INPUT_TAG" ]; then
            TAG_NAME="v1.0.${{ github.run_number }}"
          else
            if [[ "$INPUT_TAG" != v* ]]; then
              TAG_NAME="v$INPUT_TAG"
            else
              TAG_NAME="$INPUT_TAG"
            fi
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Determined release tag: $TAG_NAME"

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating new debug keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Package App APK
        run: |
          APK_SOURCE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "ERROR: Could not locate built APK."
            exit 1
          fi
          echo "Found APK at: $APK_SOURCE"
          
          OUTPUT_APK_NAME="Duddy-${{ env.TAG_NAME }}.apk"
          cp "$APK_SOURCE" "$OUTPUT_APK_NAME"
          echo "Packaged APK as: $OUTPUT_APK_NAME"
          echo "OUTPUT_APK_NAME=$OUTPUT_APK_NAME" >> $GITHUB_ENV

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Duddy-APK-${{ env.TAG_NAME }}
          path: ${{ env.OUTPUT_APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and Attach APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUSTOM_NOTES="${{ github.event.inputs.custom_notes }}"
          if [ -n "$CUSTOM_NOTES" ]; then
            cat <<EOF > release_notes.md
          ### 🚀 What's New in Duddy ${{ env.TAG_NAME }}

          $CUSTOM_NOTES

          ---
          *Built with Material 3 Expressive and Kotlin.*
          EOF
          else
            cat <<EOF > release_notes.md
          ### 🚀 Duddy ${{ env.TAG_NAME }}

          Fast, simple file download manager built with Material 3 Expressive design principles.

          - Real-time download progress tracking with live speed and ETA
          - File name badge displayed on top of the progress bar
          - Link-only input with enhanced short-link resolution and error diagnostics
          - Continuous direct stream with no pause/resume overhead

          ---
          *See below for full commit changelog and download the APK.*
          EOF
          fi

          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.is_draft }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --draft"
          fi
          if [ "${{ github.event.inputs.is_prerelease }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --prerelease"
          fi

          gh release create "${{ env.TAG_NAME }}" "${{ env.OUTPUT_APK_NAME }}" \
            --title "Duddy ${{ env.TAG_NAME }}" \
            --notes-file release_notes.md \
            --generate-notes \
            $EXTRA_FLAGS
